<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14181f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Üligod's MTG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Üligod's MTG Deck Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Tokens. Layout: uma coluna estreita para telemóvel, navegação em baixo, cartões de leitura rápida. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface-2: #e6eaee; --line: #d3d9df;
  --fg: #151a21; --fg-2: #4b5563; --fg-3: #6b7480;
  --accent: #1d7a6c; --accent-fg: #ffffff; --accent-soft: #d6ede8;
  --ok: #1f7a46; --ok-soft: #d9efe1; --warn: #9a6300; --warn-soft: #f6e8c6; --bad: #b3261e; --bad-soft: #f8dcda;
  --r-common: #6b7480; --r-uncommon: #4f86a8; --r-rare: #b07d1a; --r-mythic: #c0502a;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --surface: #171c23; --surface-2: #202731; --line: #2b3440;
    --fg: #e8ecf0; --fg-2: #aab3bd; --fg-3: #818b97;
    --accent: #3fb8a5; --accent-fg: #06201b; --accent-soft: #15332e;
    --ok: #55c783; --ok-soft: #14301f; --warn: #e2ac45; --warn-soft: #37290c; --bad: #f0786f; --bad-soft: #3a1815;
    --r-common: #8a94a0; --r-uncommon: #6fa8cc; --r-rare: #d6a437; --r-mythic: #e0714a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --surface: #171c23; --surface-2: #202731; --line: #2b3440;
  --fg: #e8ecf0; --fg-2: #aab3bd; --fg-3: #818b97;
  --accent: #3fb8a5; --accent-fg: #06201b; --accent-soft: #15332e;
  --ok: #55c783; --ok-soft: #14301f; --warn: #e2ac45; --warn-soft: #37290c; --bad: #f0786f; --bad-soft: #3a1815;
  --r-common: #8a94a0; --r-uncommon: #6fa8cc; --r-rare: #d6a437; --r-mythic: #e0714a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(76px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 640px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-cond); font-weight: 600; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h2 { font-size: 20px; } h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); font-weight: 600; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-3); } .small { font-size: 13px; }

/* topo */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
.brand { font-family: var(--font-cond); font-weight: 600; font-size: 18px; line-height: 1.1; }
.brand small { display: block; font-family: var(--font); font-weight: 400; font-size: 12px; color: var(--fg-3); }
.who { display: flex; align-items: center; gap: 8px; }
.who button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--fg-2); font-size: 13px; }

/* navegação */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center;
}
nav.tabs .in { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 100%; max-width: 640px; }
nav.tabs button { background: none; border: 0; border-radius: 10px; padding: 8px 4px; color: var(--fg-3); font-size: 12px; display: grid; gap: 2px; justify-items: center; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* cartões e listas */
.stack { display: grid; gap: 14px; padding-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.card > h3 { margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 6px; text-align: center; }
.stat b { display: block; font: 600 22px/1.1 var(--mono); }
.stat span { font-size: 11.5px; white-space: nowrap; color: var(--fg-2); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--fg-2); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.acc { background: var(--accent-soft); color: var(--accent); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--fg-2); }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
input[type=text], input[type=email], input[type=password], input[type=search], select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
textarea { min-height: 140px; font-family: var(--mono); font-size: 13px; }
label { display: grid; gap: 6px; font-size: 13px; color: var(--fg-2); }
.btn { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; min-height: 44px; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.list { display: grid; gap: 8px; }
.deck { display: grid; gap: 6px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.deck .t { font-weight: 600; overflow-wrap: anywhere; }
.deck .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ev { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.ev:first-of-type { border-top: 0; padding-top: 0; }
.ev .d { font: 500 13px/1.2 var(--mono); color: var(--fg-2); }
.ev .d b { display: block; font-size: 20px; color: var(--fg); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--r-common); }
.dot.uncommon { background: var(--r-uncommon); } .dot.rare { background: var(--r-rare); } .dot.mythic { background: var(--r-mythic); }
.cl { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.cl:first-of-type { border-top: 0; }
.cl .q { font: 600 14px var(--mono); text-align: right; }
.cl .n { overflow-wrap: anywhere; }
.curve { display: flex; align-items: flex-end; gap: 6px; height: 72px; }
.curve div { flex: 1; display: grid; justify-items: center; align-content: end; gap: 3px; height: 100%; font: 12px var(--mono); color: var(--fg-3); }
.curve i { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.sheet .bar { position: sticky; top: 0; background: var(--bg); padding: 12px 0; display: flex; align-items: center; gap: 10px; z-index: 2; }
.back { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-height: 40px; padding: 0 12px; }
.note { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: 13px; }
.note.warn { border-color: var(--warn); background: var(--warn-soft); } .note.bad { border-color: var(--bad); background: var(--bad-soft); }
.auth { min-height: 100dvh; display: grid; align-content: center; padding: 24px 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; z-index: 30; max-width: 90vw; font-size: 14px; }
.pill-mana { display: inline-flex; gap: 2px; }
.pill-mana i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.25); }
.mW { background: #f4efd6; } .mU { background: #5aa0d8; } .mB { background: #4a4348; } .mR { background: #d9573e; } .mG { background: #4aa564; }
/* miniaturas, ligações nos nomes e janela da carta */
.cl.has-th { grid-template-columns: 28px 36px 1fr auto; }
.th { width: 36px; height: 50px; border-radius: 3px; background: var(--surface-2); object-fit: cover; display: block; }
.th.empty { border: 1px dashed var(--line); background: transparent; }
.lnk { background: none; border: 0; padding: 0; margin: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; overflow-wrap: anywhere; }
.lnk:hover { color: var(--accent); text-decoration-color: var(--accent); }
.cm { position: fixed; inset: 0; z-index: 40; background: rgba(8, 10, 14, .74); display: grid; place-items: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
/* Coluna (flex) em vez de grelha: os blocos nunca encolhem uns para cima dos outros; se faltar altura, a janela faz scroll. */
.cm-box { position: relative; width: min(100%, 440px); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.cm-box > * { flex: none; }
.cm-top { display: flex; align-items: center; justify-content: flex-end; }
/* X: 30px visíveis e 30px de toque (sem área extra). Na janela da carta flutua no canto, sem ocupar uma linha própria. */
.cm-x { flex: none; width: 30px; height: 30px; min-height: 30px; padding: 0; font-size: 14px; line-height: 1; border-radius: 8px; display: inline-grid; place-items: center; }
.cm-x.fl { position: absolute; top: 8px; right: 8px; z-index: 3; box-shadow: 0 1px 6px rgba(0, 0, 0, .35); }
.cm-img { width: min(100%, 340px); aspect-ratio: 488 / 680; margin: 0 auto; border-radius: 4.75% / 3.4%; background: var(--surface-2); overflow: hidden; display: grid; place-items: center; }
.cm-img img { width: 100%; height: 100%; display: block; object-fit: contain; }
@media (prefers-reduced-motion: no-preference) { .cm-img img.flipin { animation: flipin .28s ease-out; } @keyframes flipin { from { transform: rotateY(90deg); opacity: .3; } to { transform: rotateY(0); opacity: 1; } } }
.cm-fb { padding: 20px; text-align: center; color: var(--fg-3); font-size: 14px; }
.cm-sec { display: grid; gap: 6px; }
.cm-info { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.cm-nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.cm-nav .back:last-child { justify-self: end; }
.cost { display: inline-flex; gap: 2px; align-items: center; flex-wrap: wrap; }
.sym { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 3px; border-radius: 10px; font: 600 11px/1 var(--mono); background: #cfd3d8; color: #151a21; border: 1px solid rgba(0, 0, 0, .25); }
.sym.W { background: #f4efd6; } .sym.U { background: #5aa0d8; } .sym.B { background: #4a4348; color: #fff; } .sym.R { background: #d9573e; } .sym.G { background: #4aa564; }
.cm.tx { z-index: 50; }
.cm.tx .cm-box { width: min(100%, 520px); padding: 12px; gap: 10px; }
.tx-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tx-head h2 { font-size: 18px; overflow-wrap: anywhere; }
.tx-ta { min-height: 220px; width: 100%; white-space: pre; overflow: auto; }
.tx-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tx-row > * { flex: 1 1 140px; }
.sheet .bar { flex-wrap: wrap; }
.sheet .bar .xbtn { margin-left: auto; font-size: 13px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(14px); opacity: .6; } } .cm-box { animation: pop .14s ease-out; } @keyframes pop { from { transform: scale(.97); opacity: .6; } } }
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* Leitor do Player.log do MTG Arena (corre no dispositivo; o ficheiro não é enviado).
 * Formato: uma linha "<== NomeDoPedido(id)" seguida de uma linha com o JSON da resposta. */
(function (root) {
  'use strict';

  // Formato do Arena -> código de formato da base de dados
  var FORMAT_MAP = {
    Standard: 'standard', TraditionalStandard: 'standard',
    Alchemy: 'alchemy', TraditionalAlchemy: 'alchemy',
    Historic: 'historic', HistoricNBL: 'historic', TraditionalHistoric: 'historic', Gladiator: 'historic',
    Explorer: 'pioneer', TraditionalExplorer: 'pioneer',
    Timeless: 'timeless', TraditionalTimeless: 'timeless',
    Brawl: 'brawl', HistoricBrawl: 'brawl', StandardBrawl: 'standard_brawl'
  };

  function attr(summary, name) {
    var list = (summary && summary.Attributes) || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].name === name) return String(list[i].value).replace(/^"|"$/g, '');
    }
    return null;
  }

  function isPrecon(name) {
    return typeof name === 'string' && (name.indexOf('?=?Loc') === 0 || name.indexOf('Precon') !== -1);
  }

  function zoneCards(list) {
    var acc = {};
    (list || []).forEach(function (c) {
      acc[c.cardId] = (acc[c.cardId] || 0) + c.quantity;
    });
    return Object.keys(acc).map(function (id) { return { arena_id: Number(id), quantity: acc[id] }; });
  }

  function parsePlayerLog(text) {
    var lines = text.split(/\r?\n/);
    var hooks = [];
    for (var i = 0; i < lines.length - 1; i++) {
      if (/<== StartHook\(/.test(lines[i])) {
        try { hooks.push(JSON.parse(lines[i + 1])); } catch (e) { /* linha truncada */ }
      }
    }
    var out = {
      detailedLogs: /DETAILED LOGS: ENABLED/.test(text.slice(0, 200000)),
      screenName: null, hooks: hooks.length, wallet: null,
      decks: [], preconsIgnored: 0, hasDecks: false
    };
    var m = text.match(/"screenName"\s*:\s*"([^"]+)"/);
    if (m) out.screenName = m[1];

    // carteira: o último StartHook que a tenha
    for (var h = hooks.length - 1; h >= 0; h--) {
      var inv = hooks[h].InventoryInfo;
      if (inv) {
        out.wallet = {
          gems: inv.Gems || 0, gold: inv.Gold || 0,
          // TotalVaultProgress vem em milésimas (1000 = cofre cheio)
          vault_progress: (inv.TotalVaultProgress || 0) / 10,
          wc_common: inv.WildCardCommons || 0, wc_uncommon: inv.WildCardUnCommons || 0,
          wc_rare: inv.WildCardRares || 0, wc_mythic: inv.WildCardMythics || 0
        };
        break;
      }
    }

    // decks: o StartHook que contém DecksInternal (o do arranque)
    var src = null;
    for (var k = 0; k < hooks.length; k++) { if (hooks[k].DecksInternal) { src = hooks[k]; break; } }
    if (src) {
      out.hasDecks = true;
      var summaries = {};
      (src.DeckSummaries || []).forEach(function (s) { summaries[s.DeckIdInternal] = s; });
      Object.keys(src.DecksInternal).forEach(function (id) {
        var d = src.DecksInternal[id];
        var s = summaries[id] || {};
        var name = s.Name || id;
        if (isPrecon(name)) { out.preconsIgnored++; return; }
        var arenaFormat = attr(s, 'Format') || '';
        out.decks.push({
          arena_deck_id: id,
          name: name,
          arena_format: arenaFormat,
          format_code: FORMAT_MAP[arenaFormat] || 'custom',
          is_bo1: arenaFormat.indexOf('Traditional') !== 0,
          cards: []
            .concat(zoneCards(d.MainDeck).map(function (c) { c.zone = 'main'; return c; }))
            .concat(zoneCards(d.Sideboard).map(function (c) { c.zone = 'side'; return c; }))
            .concat(zoneCards(d.CommandZone).map(function (c) { c.zone = 'command'; return c; }))
            .concat(zoneCards(d.Companions).map(function (c) { c.zone = 'companion'; return c; }))
        });
      });
    }
    return out;
  }

  // Lista de texto do Arena: "4 Llanowar Elves (FDN) 227" ou "4 Llanowar Elves"
  function parseCardList(text) {
    var rows = [], bad = [];
    text.split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim();
      if (!line || /^(deck|sideboard|companion|commander|about|name)\b/i.test(line)) return;
      var m = line.match(/^(\d+)x?\s+(.+?)(?:\s+\(([A-Za-z0-9]{2,5})\)\s+(\S+))?$/);
      if (!m) { bad.push(line); return; }
      rows.push({ quantity: Number(m[1]), name: m[2].trim(), set: m[3] ? m[3].toLowerCase() : null, num: m[4] || null });
    });
    return { rows: rows, bad: bad };
  }

  // Texto de deck do Arena (aceita também listas simples tipo MTGO/Moxfield): secções «Deck», «Sideboard», «Commander», «Companion».
  // Linha de carta: "4 Llanowar Elves (FDN) 227" ou só "4 Llanowar Elves".
  function parseDeckText(text) {
    var rows = [], bad = [], name = null, zone = 'main', header = false, afterMain = false;
    var HEAD = /^(deck|main\s*deck|main|sideboard|side\s*board|side|commander|companion)\s*:?$/i;
    // normaliza: espaços invisíveis, \r isolado e colagens numa só linha (entradas coladas umas às outras)
    var norm = String(text || '').replace(/[\u00a0\u2007\u202f\u200b\ufeff]/g, ' ').replace(/\r\n?|\u2028|\u2029/g, '\n')
      .replace(/(\([A-Za-z0-9]{1,6}\)\s+\S+)[ \t]+(?=(?:\d{1,3}\s*x?\s+[^\s\d]|(?:deck|sideboard|commander|companion)\b))/gi, '$1\n')
      .replace(/^[ \t]*(deck|sideboard|commander|companion)[ \t]+(?=\d)/gim, '$1\n');
    norm.split('\n').forEach(function (raw) {
      var line = raw.replace(/\*F\*|\[[^\]]*\]/g, '').trim();   // tira marcas de foil e etiquetas
      if (!line) { if (!header && afterMain && zone === 'main') zone = 'side'; return; }   // sem cabeçalhos: a linha em branco separa o sideboard
      if (/^(\/\/|#)/.test(line) || /^about$/i.test(line)) return;
      var nm = line.match(/^(?:deck\s+)?name\s*:?\s+(.+)$/i);
      if (nm) { name = nm[1].trim(); return; }
      var hm = line.match(HEAD);
      if (hm) {
        var k = hm[1].toLowerCase().replace(/\s+/g, '');
        zone = (k === 'sideboard' || k === 'side') ? 'side' : k === 'commander' ? 'command' : k === 'companion' ? 'companion' : 'main';
        header = true; return;
      }
      var sb = /^SB:\s*/i.test(line);
      var m = line.replace(/^SB:\s*/i, '').match(/^(\d+)(?:\s*x)?\s+(.+?)(?:\s+\(([A-Za-z0-9]{1,6})\)(?:\s+(\S+))?)?$/);
      if (!m || Number(m[1]) < 1 || Number(m[1]) > 999) { bad.push(raw.trim()); return; }

function deckDetail(d, lines, craft) {

    var res = h('div', { class: 'stack', style: 'padding:0' }), go = h('button', { class: 'btn', type: 'button', text: 'Verificar texto' });
    var plan = null, parsed = null;
    function reset() { plan = null; parsed = null; res.replaceChildren(); go.disabled = false; go.textContent = 'Verificar texto'; }
    function preview() {
      var diff = diffPlan(lines, plan, sel.value);
      plan.diff = diff;
      fill(res, [
        h('div', { class: 'note' }, plan.total + ' cartas reconhecidas no catálogo (' + planSummary(plan) + ').'),
        plan.unresolved.length ? listNote('Sem entrada no catálogo (ficam guardadas só pelo nome)', plan.unresolved.map(function (u) { return u.quantity + '× ' + u.label; }), 'bad') : null,
        parsed.bad.length ? listNote('Linhas ignoradas (formato não reconhecido)', parsed.bad, 'warn') : null,
        diff.same ? h('div', { class: 'note warn', text: 'Nenhuma alteração: o deck já está igual ao texto' + (sel.value === 'merge' ? ' (ou o texto não traz nada de novo)' : '') + '. Nada para guardar.' }) : null
      ].concat(diffNodes(diff)).concat([
        d.source === 'log' || d.arena_deck_id ? h('div', { class: 'small muted', text: 'Nota: este deck veio do Player.log; se importares o Player.log outra vez, as cartas voltam às do Arena.' }) : null]));
      go.textContent = 'Guardar alterações'; go.disabled = diff.same;
    }
    ta.addEventListener('input', reset);
    sel.addEventListener('change', function () { if (plan) preview(); });
    go.addEventListener('click', async function () {
      go.disabled = true;
      try {
        if (plan) {   // 2.º passo: guardar (com verificação)
          go.textContent = 'A guardar…';
          var d2 = plan.diff;
          await writeDeck(d.deck_id, d2.fin, d2.finX);
          toast('Guardado e confirmado: +' + d2.added.length + ' novas, ' + d2.changed.length + ' alteradas, −' + d2.removed.length + ' removidas.');
          m.close(); if (onDone) await onDone(); return;
        }
        parsed = window.MTGLog.parseDeckText(ta.value);
        if (!parsed.rows.length) throw new Error('Não encontrei nenhuma linha de carta. Usa o formato «4 Nome da carta (SET) 123».');
        res.replaceChildren(h('p', { class: 'muted', text: 'A procurar as cartas…' }));
        plan = await resolveRows(parsed.rows);
        if (!plan.cards.length) { var u = plan.unresolved.length; plan = null; throw new Error('Nenhuma carta foi reconhecida no catálogo' + (u ? ' (' + u + ' linhas sem entrada)' : '') + '.'); }
        preview();
      } catch (e) { res.replaceChildren(h('div', { class: 'note bad', text: e.message })); plan = null; go.textContent = 'Verificar texto'; go.disabled = false; return; }
    });
    return h('div', { class: 'stack', style: 'padding:0' },
      h('div', { class: 'small muted', text: 'No Arena: abre o deck → Exportar (copia o texto) e cola aqui. Primeiro vês exatamente o que vai mudar; só depois guardas.' }), ta,
      h('label', null, 'O que fazer', sel), res, go);
  }
  paint();
}
// Deck novo a partir de texto do Arena
function openNewDeckImport() {
  var m = txModal('Importar deck novo');
  var ta = h('textarea', { class: 'tx-ta', spellcheck: 'false', placeholder: IMPORT_PLACEHOLDER, 'aria-label': 'Texto do deck' });
  var nameIn = h('input', { type: 'text', placeholder: 'Nome do deck', maxlength: 80, 'aria-label': 'Nome do deck' });
  var fmts = ['standard', 'alchemy', 'historic', 'pioneer', 'timeless', 'brawl', 'standard_brawl', 'competitive_brawl', 'custom'];
  var fsel = h('select', { 'aria-label': 'Formato' }, fmts.map(function (f) { return h('option', { value: f, text: FORMAT_LABEL[f] || f }); }));
  var res = h('div', { class: 'stack', style: 'padding:0' }), go = h('button', { class: 'btn', type: 'button', text: 'Verificar texto' }), plan = null, parsed = null;
  ta.addEventListener('input', function () { plan = null; parsed = null; res.replaceChildren(); go.disabled = false; go.textContent = 'Verificar texto'; });
  go.addEventListener('click', async function () {
    go.disabled = true;
    try {
      if (plan) {
        go.textContent = 'A criar…';
        var nm = nameIn.value.trim() || parsed.name || 'Deck importado';
        var ins = await q(sb.from('decks').insert({ user_id: S.session.user.id, name: nm, format_code: fsel.value, source: 'import', is_bo1: true }).select('id'));
        var id = ins.data[0].id;
        try { await writeDeck(id, plan.diff.fin, plan.diff.finX); }
        catch (e) { try { await sb.from('decks').delete().eq('id', id); } catch (x) { /* ignora */ } throw e; }   // sem deck vazio a meio
        toast('Deck criado e confirmado: ' + nm + '.'); m.close(); await loadAll(); S.tab = 'decks'; S.fmt = 'all'; S.q = ''; render(); return;
      }
      parsed = window.MTGLog.parseDeckText(ta.value);
      if (!parsed.rows.length) throw new Error('Não encontrei nenhuma linha de carta. Usa o formato «4 Nome da carta (SET) 123».');
      res.replaceChildren(h('p', { class: 'muted', text: 'A procurar as cartas…' }));
      var r = await resolveRows(parsed.rows);
      if (!r.cards.length) throw new Error('Nenhuma carta foi reconhecida no catálogo.');
      r.diff = diffPlan([], r, 'replace'); plan = r;
      if (parsed.name && !nameIn.value.trim()) nameIn.value = parsed.name;
      if (parsed.rows.some(function (x) { return x.zone === 'command'; })) fsel.value = 'brawl';
      fill(res,
        h('div', { class: 'note' }, r.total + ' cartas reconhecidas (' + planSummary(r) + '). Confirma o nome e o formato e guarda.'),
        r.unresolved.length ? listNote('Sem entrada no catálogo (ficam guardadas só pelo nome)', r.unresolved.map(function (u) { return u.quantity + '× ' + u.label; }), 'bad') : null,
        parsed.bad.length ? listNote('Linhas ignoradas (formato não reconhecido)', parsed.bad, 'warn') : null);
      go.textContent = 'Criar deck';
    } catch (e) { res.replaceChildren(h('div', { class: 'note bad', text: e.message })); plan = null; go.textContent = 'Verificar texto'; }
    go.disabled = false;
  });
  m.box.appendChild(h('div', { class: 'stack', style: 'padding:0' },
    h('div', { class: 'small muted', text: 'No Arena: abre o deck → Exportar (copia o texto) e cola aqui.' }),
    ta, h('label', null, 'Nome', nameIn), h('label', null, 'Formato', fsel), res, go));
}

async function saveLog(p, removeMissing) {
  var uid = S.session.user.id;
  var counts = { decks: 0 };
  if (p.wallet) {
    await q(sb.from('user_wallet').upsert(Object.assign({ user_id: uid, updated_at: new Date().toISOString() }, p.wallet), { onConflict: 'user_id' }));
  }
  if (!p.hasDecks) return counts;
  var ex = await q(sb.from('decks').select('id,arena_deck_id').eq('source', 'log'));
  var byArena = {}; (ex.data || []).forEach(function (d) { byArena[d.arena_deck_id] = d.id; });
  var toCreate = [], toUpdate = [];
  p.decks.forEach(function (d) {
    var row = { user_id: uid, name: d.name, format_code: d.format_code, source: 'log', arena_deck_id: d.arena_deck_id, is_bo1: d.is_bo1, updated_at: new Date().toISOString() };
    if (byArena[d.arena_deck_id]) { row.id = byArena[d.arena_deck_id]; toUpdate.push(row); } else toCreate.push(row);
  });
  var idOf = {};
  Object.keys(byArena).forEach(function (k) { idOf[k] = byArena[k]; });
  if (toCreate.length) {
    var ins = await q(sb.from('decks').insert(toCreate).select('id,arena_deck_id'));
    ins.data.forEach(function (d) { idOf[d.arena_deck_id] = d.id; });
  }
  if (toUpdate.length) await q(sb.from('decks').upsert(toUpdate, { onConflict: 'id' }));
  var ids = p.decks.map(function (d) { return idOf[d.arena_deck_id]; });
  for (var i = 0; i < ids.length; i += 20) { await q(sb.from('deck_cards').delete().in('deck_id', ids.slice(i, i + 20))); await q(sb.from('deck_extra_cards').delete().in('deck_id', ids.slice(i, i + 20))); }   // o Player.log traz as cartas reais: as «extra» deixam de ser precisas
  var rows = [];
  p.decks.forEach(function (d) { d.cards.forEach(function (c) { rows.push({ deck_id: idOf[d.arena_deck_id], arena_id: c.arena_id, quantity: c.quantity, zone: c.zone }); }); });
  for (var j = 0; j < rows.length; j += 800) await q(sb.from('deck_cards').insert(rows.slice(j, j + 800)));
  if (removeMissing) {
    var keep = {}; p.decks.forEach(function (d) { keep[d.arena_deck_id] = true; });
    var gone = Object.keys(byArena).filter(function (k) { return !keep[k]; }).map(function (k) { return byArena[k]; });
    for (var g = 0; g < gone.length; g += 20) await q(sb.from('decks').delete().in('id', gone.slice(g, g + 20)));
  }
  counts.decks = p.decks.length;
  return counts;
}

async function importCollection(text, replaceAll) {
  var uid = S.session.user.id;
  var parsed = window.MTGLog.parseCardList(text);
  if (!parsed.rows.length) throw new Error('Não encontrei nenhuma linha válida. Usa «4 Nome da carta (SET) 123».');
  var bySetNum = {}, names = {};
  parsed.rows.forEach(function (r) { if (r.set && r.num) (bySetNum[r.set] = bySetNum[r.set] || []).push(r.num); else names[r.name] = true; });
  var found = {};     // chave -> arena_id
  var sets = Object.keys(bySetNum);
  for (var i = 0; i < sets.length; i++) {
    var rs = await q(sb.from('cards').select('arena_id,set_code,collector_number').eq('set_code', sets[i]).in('collector_number', bySetNum[sets[i]]).not('arena_id', 'is', null));
    rs.data.forEach(function (c) { found[c.set_code + ':' + c.collector_number] = c.arena_id; });
  }
  // restantes (e as que falharam por set/número) por nome
  parsed.rows.forEach(function (r) { if (!(r.set && r.num && found[r.set + ':' + r.num])) names[r.name] = true; });
  var nameList = Object.keys(names), byName = {};
  for (var n = 0; n < nameList.length; n += 40) {
    var rn = await q(sb.from('cards').select('arena_id,name,set_code').in('name', nameList.slice(n, n + 40)).not('arena_id', 'is', null).order('arena_id', { ascending: false }));
    rn.data.forEach(function (c) { if (!byName[c.name]) byName[c.name] = c.arena_id; });
  }
  var qty = {}, notFound = [];
  parsed.rows.forEach(function (r) {
    var id = (r.set && r.num && found[r.set + ':' + r.num]) || byName[r.name];
    if (!id) { notFound.push(r.name); return; }
    qty[id] = (qty[id] || 0) + r.quantity;
  });
  var rows = Object.keys(qty).map(function (id) { return { user_id: uid, arena_id: Number(id), quantity: Math.min(qty[id], 99), updated_at: new Date().toISOString() }; });
  if (replaceAll) await q(sb.from('user_collection').delete().eq('user_id', uid));
  for (var k = 0; k < rows.length; k += 500) await q(sb.from('user_collection').upsert(rows.slice(k, k + 500), { onConflict: 'user_id,arena_id' }));
  return { ok: rows.length, copies: rows.reduce(function (a, r) { return a + r.quantity; }, 0), notFound: notFound, bad: parsed.bad.length };
}

/* ---------- arranque ---------- */
async function boot() {
  var r = await sb.auth.getSession();
  S.session = r.data.session;
  sb.auth.onAuthStateChange(function (_e, session) {
    var was = S.session; S.session = session;
    if (!session) {
      closeCard(true); S.decks = null; S.cardCache = {}; S.wallet = null; S.events = null; S.bans = {}; S.collCount = null;
      Array.prototype.forEach.call(document.querySelectorAll('.sheet'), function (s) { s.remove(); });
      document.body.style.overflow = ''; render(); return;
    }
    // fora do callback: chamar o Supabase aqui dentro pode bloquear o pedido de sessão
    if (!was || was.user.id !== session.user.id) setTimeout(startLoad, 0);
  });
  if (S.session) startLoad(); else render();
}
async function startLoad() {
  S.decks = null; render();
  try { await loadAll(); render(); }
  catch (e) { $app.replaceChildren(h('div', { class: 'wrap stack', style: 'padding-top:24px' }, h('div', { class: 'note bad', text: 'Erro ao carregar os dados: ' + e.message }), h('button', { class: 'btn', type: 'button', text: 'Tentar de novo', onclick: startLoad }))); }
}
boot();
})();
