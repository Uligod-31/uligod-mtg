<script>
/* Tema antes de pintar (evita o «flash»): escuro por defeito, claro só se o utilizador o escolheu. */
(function () {
  var t = 'dark';
  try { var s = localStorage.getItem('uligod-theme'); if (s === 'light' || s === 'dark') t = s; } catch (e) { /* sem armazenamento: fica escuro */ }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'light' ? '#eef0f6' : '#15161a');
})();
</script>

<style>
/* Tokens. Layout: uma coluna estreita para telemóvel, navegação em baixo, cartões de leitura rápida. */
:root {
  --bg: #eef0f6; --surface: #ffffff; --surface-2: #e7e9f1; --line: #d5d9e4;
  --fg: #16181f; --fg-2: #4a4f5c; --fg-3: #6b7080;
  --accent: #2a5fe0; --accent-fg: #ffffff; --accent-soft: #dce6fc;
  --hot: #c8179f; --hot-soft: #fbdcf3; --grad: linear-gradient(135deg, #2a5fe0 0%, #7a3fd6 55%, #c8179f 100%);
  --ok: #1f7a46; --ok-soft: #d9efe1; --warn: #9a6300; --warn-soft: #f6e8c6; --bad: #b3261e; --bad-soft: #f8dcda;
  --r-common: #6b7480; --r-uncommon: #4f86a8; --r-rare: #b07d1a; --r-mythic: #c0502a;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
/* Tema: escuro por defeito; o botão no topo alterna e a escolha fica guardada (ver script no início). */
:root[data-theme="dark"] {
  --bg: #15161a; --surface: #1e2025; --surface-2: #2a2c33; --line: #373a43;
  --fg: #eceef3; --fg-2: #b0b4c0; --fg-3: #858a98;
  --accent: #5b92ff; --accent-fg: #ffffff; --accent-soft: #1d2b4d;
  --hot: #ff4fd8; --hot-soft: #45163b; --grad: linear-gradient(135deg, #3b74f2 0%, #8a4bea 55%, #e02bc0 100%);
  --ok: #55c783; --ok-soft: #14301f; --warn: #e2ac45; --warn-soft: #37290c; --bad: #f0786f; --bad-soft: #3a1815;
  --r-common: #8a94a0; --r-uncommon: #6fa8cc; --r-rare: #d6a437; --r-mythic: #e0714a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(76px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 640px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-cond); font-weight: 600; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h2 { font-size: 20px; } h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); font-weight: 600; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-3); } .small { font-size: 13px; }

/* topo */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.top::after { content: ""; display: block; height: 2px; background: var(--grad); border-radius: 2px; }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
.brand { font-family: var(--font-cond); font-weight: 600; font-size: 18px; line-height: 1.1; }
.brand small { display: block; font-family: var(--font); font-weight: 400; font-size: 12px; color: var(--fg-3); }
.who { display: flex; align-items: center; gap: 8px; }
.who button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--fg-2); font-size: 13px; }

/* navegação */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center;
}
nav.tabs .in { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; width: 100%; max-width: 640px; }
nav.tabs button { background: none; border: 0; border-radius: 10px; padding: 8px 4px; color: var(--fg-3); font-size: 12px; display: grid; gap: 2px; justify-items: center; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--hot); background: var(--hot-soft); }
nav.tabs button[aria-current="page"]::after { content: ""; position: absolute; left: 28%; right: 28%; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--grad); }

/* cartões e listas */
.stack { display: grid; gap: 14px; padding-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.card > h3 { margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 6px; text-align: center; }
.stat b { display: block; font: 600 22px/1.1 var(--mono); }
.stat span { font-size: 11.5px; white-space: nowrap; color: var(--fg-2); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--fg-2); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.acc { background: var(--accent-soft); color: var(--accent); } .chip.hot { background: var(--hot-soft); color: var(--hot); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--fg-2); }
.filters button[aria-pressed="true"] { background: var(--grad); border-color: transparent; color: #fff; }
input[type=text], input[type=email], input[type=password], input[type=search], select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
textarea { min-height: 140px; font-family: var(--mono); font-size: 13px; }
label { display: grid; gap: 6px; font-size: 13px; color: var(--fg-2); }
.btn { background: var(--grad); color: #fff; border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; min-height: 44px; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.ghost:hover { border-color: var(--hot); color: var(--hot); }
.btn:disabled { opacity: .5; cursor: default; }
.list { display: grid; gap: 8px; }
.deck { display: grid; gap: 6px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.deck .t { font-weight: 600; overflow-wrap: anywhere; }
.deck .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ev { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.ev:first-of-type { border-top: 0; padding-top: 0; }
.ev .d { font: 500 13px/1.2 var(--mono); color: var(--fg-2); }
.ev .d b { display: block; font-size: 20px; color: var(--fg); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--r-common); }
.dot.uncommon { background: var(--r-uncommon); } .dot.rare { background: var(--r-rare); } .dot.mythic { background: var(--r-mythic); }
.cl { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.cl:first-of-type { border-top: 0; }
.cl .q { font: 600 14px var(--mono); text-align: right; }
.cl .n { overflow-wrap: anywhere; }
.curve { display: flex; align-items: flex-end; gap: 6px; height: 72px; }
.curve div { flex: 1; display: grid; justify-items: center; align-content: end; gap: 3px; height: 100%; font: 12px var(--mono); color: var(--fg-3); }
.curve i { display: block; width: 100%; background: var(--grad); border-radius: 3px 3px 0 0; min-height: 2px; }
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.sheet .bar { position: sticky; top: 0; background: var(--bg); padding: 12px 0; display: flex; align-items: center; gap: 10px; z-index: 2; }
.back { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-height: 40px; padding: 0 12px; }
.note { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: 13px; }
.note.warn { border-color: var(--warn); background: var(--warn-soft); } .note.bad { border-color: var(--bad); background: var(--bad-soft); }
.auth { min-height: 100dvh; display: grid; align-content: center; padding: 24px 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; z-index: 30; max-width: 90vw; font-size: 14px; }
.pill-mana { display: inline-flex; gap: 2px; }
.pill-mana i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.25); }
.mW { background: #f4efd6; } .mU { background: #5aa0d8; } .mB { background: #4a4348; } .mR { background: #d9573e; } .mG { background: #4aa564; }
/* miniaturas, ligações nos nomes e janela da carta */
.cl.has-th { grid-template-columns: 28px 36px 1fr auto; }
.th { width: 36px; height: 50px; border-radius: 3px; background: var(--surface-2); object-fit: cover; display: block; }
.th.empty { border: 1px dashed var(--line); background: transparent; }
.lnk { background: none; border: 0; padding: 0; margin: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; overflow-wrap: anywhere; }
.lnk:hover { color: var(--accent); text-decoration-color: var(--accent); }
.cm { position: fixed; inset: 0; z-index: 40; background: rgba(8, 10, 14, .74); display: grid; place-items: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
/* Coluna (flex) em vez de grelha: os blocos nunca encolhem uns para cima dos outros; se faltar altura, a janela faz scroll. */
.cm-box { position: relative; width: min(100%, 440px); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.cm-box > * { flex: none; }
.cm-top { display: flex; align-items: center; justify-content: flex-end; }
/* X: só o símbolo (sem caixa, borda nem fundo); 30px de tamanho e 30px de zona de toque. Na janela da carta flutua no canto. */
.cm-x, .cm-x:hover, .cm-x:active { flex: none; width: 30px; height: 30px; min-height: 30px; padding: 0; margin: 0; background: none; border: 0; border-radius: 0; box-shadow: none;
  font-size: 26px; font-weight: 300; line-height: 30px; text-align: center; color: var(--fg); cursor: pointer; display: inline-block; }
.cm-x:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
.cm-x.fl { position: absolute; top: 4px; right: 4px; z-index: 3; color: #fff; text-shadow: 0 0 2px #000, 0 0 5px #000, 0 0 9px rgba(0, 0, 0, .8); }
.cm-img { width: min(100%, 340px); aspect-ratio: 488 / 680; margin: 0 auto; border-radius: 4.75% / 3.4%; background: var(--surface-2); overflow: hidden; display: grid; place-items: center; }
.cm-img img { width: 100%; height: 100%; display: block; object-fit: contain; }
@media (prefers-reduced-motion: no-preference) { .cm-img img.flipin { animation: flipin .28s ease-out; } @keyframes flipin { from { transform: rotateY(90deg); opacity: .3; } to { transform: rotateY(0); opacity: 1; } } }
.cm-fb { padding: 20px; text-align: center; color: var(--fg-3); font-size: 14px; }
.cm-sec { display: grid; gap: 6px; }
.cm-info { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.cm-nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.cm-nav .back:last-child { justify-self: end; }
.cost { display: inline-flex; gap: 2px; align-items: center; flex-wrap: wrap; }
.sym { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 3px; border-radius: 10px; font: 600 11px/1 var(--mono); background: #cfd3d8; color: #151a21; border: 1px solid rgba(0, 0, 0, .25); }
.sym.W { background: #f4efd6; } .sym.U { background: #5aa0d8; } .sym.B { background: #4a4348; color: #fff; } .sym.R { background: #d9573e; } .sym.G { background: #4aa564; }
.cm.tx { z-index: 50; }
.cm.tx .cm-box { width: min(100%, 520px); padding: 12px; gap: 10px; }
.tx-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tx-head h2 { font-size: 18px; overflow-wrap: anywhere; }
.tx-ta { min-height: 220px; width: 100%; white-space: pre; overflow: auto; }
.tx-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tx-row > * { flex: 1 1 140px; }
.sheet .bar { flex-wrap: wrap; }
.sheet .bar .xbtn { margin-left: auto; font-size: 13px; }
/* botões do topo, selo nos Alertas, edição de decks */
.who .tbtn { min-width: 36px; min-height: 36px; padding: 4px 8px; line-height: 1; font-size: 16px; }
nav.tabs button { position: relative; }
.badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--bad); color: #fff; font: 600 10px/16px var(--mono); text-align: center; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; }
.step { display: inline-flex; align-items: center; gap: 2px; }
.step button { width: 40px; height: 40px; min-height: 40px; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font: 600 20px/1 var(--mono); color: var(--fg); }
.step button.del { color: var(--bad); }
.cl.edit { grid-template-columns: 28px 36px 1fr auto; }
.add-res { display: grid; gap: 6px; }
.add-res .cl { grid-template-columns: 36px 1fr auto; }
.tools { display: grid; gap: 10px; }
.tools .row > * { flex: 1 1 0; }
.pips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pips .chip { gap: 6px; }
.half { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 2px; }
.half p { margin: 0; white-space: pre-line; font-size: 13.5px; }
.rel { display: flex; flex-wrap: wrap; gap: 6px; }
.rel .chip { border: 1px solid var(--line); cursor: pointer; font: inherit; font-size: 12.5px; min-height: 32px; }
.qr { width: min(100%, 220px); aspect-ratio: 1; margin: 0 auto; background: #fff; border-radius: 10px; padding: 8px; display: block; }
.secret { font: 500 13px var(--mono); overflow-wrap: anywhere; text-align: center; user-select: all; }
.sync-prog { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.sync-prog i { display: block; height: 100%; background: var(--grad); transition: width .5s; }
.sync-res { display: grid; gap: 4px; font-size: 13.5px; }
.code-box { font: 500 12.5px var(--mono); overflow-wrap: anywhere; background: var(--surface-2); border-radius: 10px; padding: 10px; user-select: all; }.brand-head { display: grid; justify-items: center; gap: 14px; text-align: center; }
.brand-head h1 { font-size: 26px; }
.brand-head .logo { width: 112px; height: 112px; border-radius: 24%; display: block; box-shadow: 0 6px 22px rgba(0, 0, 0, .35); }
.brand-head p { margin: 0; max-width: 34ch; }
.code-in { text-align: center; font: 600 22px var(--mono); letter-spacing: .3em; }
/* coleção (estilo galeria do Arena) */
.cgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
.cc { position: relative; display: block; width: 100%; padding: 0; background: none; border: 0; text-align: left; }
.cc .im { position: relative; display: block; aspect-ratio: 488 / 680; border-radius: 4.75% / 3.4%; background: var(--surface-2); overflow: hidden; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); transition: transform .12s, box-shadow .12s; }
.cc:hover .im, .cc:focus-visible .im { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--hot), 0 6px 16px rgba(0, 0, 0, .45); }
.cc img { width: 100%; height: 100%; display: block; object-fit: cover; }
.cc .fb { position: absolute; inset: 0; display: grid; place-items: center; padding: 6px; text-align: center; font-size: 12px; color: var(--fg-2); }
.cc .qb { position: absolute; right: 5px; top: 5px; min-width: 26px; padding: 2px 6px; border-radius: 999px; background: rgba(12, 13, 17, .86); color: #fff; font: 600 12px/18px var(--mono); text-align: center; border: 1px solid rgba(255, 255, 255, .28); }
.cc .qb.full { background: var(--grad); border-color: transparent; }
.cc .rb { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--r-common); }
.cc .rb.uncommon { background: var(--r-uncommon); } .cc .rb.rare { background: var(--r-rare); } .cc .rb.mythic { background: var(--r-mythic); }
.cc .nm { margin-top: 4px; font-size: 11.5px; line-height: 1.25; color: var(--fg-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { min-height: 42px; border: 0; border-radius: 10px; background: none; color: var(--fg-2); font-weight: 600; font-size: 13.5px; padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--grad); color: #fff; box-shadow: 0 2px 10px rgba(224, 43, 192, .28); }
.cc.gone img { filter: grayscale(.92) brightness(.62); }
.cc.part img { filter: grayscale(.5) brightness(.82); }
.cc .qb.need { background: var(--hot); color: #fff; border-color: transparent; font-size: 11px; }
.cc .ql { position: absolute; left: 5px; bottom: 9px; padding: 1px 7px; border-radius: 999px; background: rgba(12, 13, 17, .86); color: #fff; font: 600 10.5px/16px var(--mono); border: 1px solid rgba(255, 255, 255, .25); }
.fdet { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.fdet summary { cursor: pointer; font-weight: 600; color: var(--fg-2); font-size: 13.5px; }
.cfil { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cfil button { min-width: 38px; min-height: 38px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.cfil button[aria-pressed="true"] { border-color: var(--hot); box-shadow: 0 0 0 1px var(--hot) inset; color: var(--fg); background: var(--hot-soft); }
.cfil .sym { width: 22px; height: 22px; }
.cmore { display: block; margin: 14px auto 0; }
.cstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat.big b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cbar { display: grid; gap: 6px; }
.cbar .r { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; color: var(--fg-2); }

<script>
/* Leitor do Player.log do MTG Arena (corre no dispositivo; o ficheiro não é enviado).
 * Formato: uma linha "<== NomeDoPedido(id)" seguida de uma linha com o JSON da resposta. */
(function (root) {
  'use strict';

  // Formato do Arena -> código de formato da base de dados
  var FORMAT_MAP = {
    Standard: 'standard', TraditionalStandard: 'standard',
    Alchemy: 'alchemy', TraditionalAlchemy: 'alchemy',
    Historic: 'historic', HistoricNBL: 'historic', TraditionalHistoric: 'historic', Gladiator: 'historic',
    Explorer: 'pioneer', TraditionalExplorer: 'pioneer',
    Timeless: 'timeless', TraditionalTimeless: 'timeless',
    Brawl: 'brawl', HistoricBrawl: 'brawl', StandardBrawl: 'standard_brawl'
  };

  function attr(summary, name) {
    var list = (summary && summary.Attributes) || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].name === name) return String(list[i].value).replace(/^"|"$/g, '');
    }
    return null;
  }

  function isPrecon(name) {
    return typeof name === 'string' && (name.indexOf('?=?Loc') === 0 || name.indexOf('Precon') !== -1);
  }

  function zoneCards(list) {
    var acc = {};
    (list || []).forEach(function (c) {
      acc[c.cardId] = (acc[c.cardId] || 0) + c.quantity;
    });
    return Object.keys(acc).map(function (id) { return { arena_id: Number(id), quantity: acc[id] }; });
  }

  function parsePlayerLog(text) {
    var lines = text.split(/\r?\n/);
    var hooks = [];
    for (var i = 0; i < lines.length - 1; i++) {
      if (/<== StartHook\(/.test(lines[i])) {
        try { hooks.push(JSON.parse(lines[i + 1])); } catch (e) { /* linha truncada */ }
      }
    }
    var out = {
      detailedLogs: /DETAILED LOGS: ENABLED/.test(text.slice(0, 200000)),
      screenName: null, hooks: hooks.length, wallet: null,
      decks: [], preconsIgnored: 0, hasDecks: false
    };
    var m = text.match(/"screenName"\s*:\s*"([^"]+)"/);
    if (m) out.screenName = m[1];

    // carteira: o último StartHook que a tenha
    for (var h = hooks.length - 1; h >= 0; h--) {
      var inv = hooks[h].InventoryInfo;
      if (inv) {
        out.wallet = {
          gems: inv.Gems || 0, gold: inv.Gold || 0,
          // TotalVaultProgress vem em milésimas (1000 = cofre cheio)
          vault_progress: (inv.TotalVaultProgress || 0) / 10,
          wc_common: inv.WildCardCommons || 0, wc_uncommon: inv.WildCardUnCommons || 0,
          wc_rare: inv.WildCardRares || 0, wc_mythic: inv.WildCardMythics || 0
        };
        break;
      }
    }

    // decks: o StartHook que contém DecksInternal (o do arranque)
    var src = null;
    for (var k = 0; k < hooks.length; k++) { if (hooks[k].DecksInternal) { src = hooks[k]; break; } }
    if (src) {
      out.hasDecks = true;
      var summaries = {};
      (src.DeckSummaries || []).forEach(function (s) { summaries[s.DeckIdInternal] = s; });
      Object.keys(src.DecksInternal).forEach(function (id) {
        var d = src.DecksInternal[id];
        var s = summaries[id] || {};
        var name = s.Name || id;
        if (isPrecon(name)) { out.preconsIgnored++; return; }
        var arenaFormat = attr(s, 'Format') || '';
        out.decks.push({
          arena_deck_id: id,
          name: name,
          arena_format: arenaFormat,
          format_code: FORMAT_MAP[arenaFormat] || 'custom',
          is_bo1: arenaFormat.indexOf('Traditional') !== 0,
          cards: []
            .concat(zoneCards(d.MainDeck).map(function (c) { c.zone = 'main'; return c; }))
            .concat(zoneCards(d.Sideboard).map(function (c) { c.zone = 'side'; return c; }))
            .concat(zoneCards(d.CommandZone).map(function (c) { c.zone = 'command'; return c; }))
            .concat(zoneCards(d.Companions).map(function (c) { c.zone = 'companion'; return c; }))
        });
      });
    }
    return out;
  }

  // Lista de texto do Arena: "4 Llanowar Elves (FDN) 227" ou "4 Llanowar Elves"
  function parseCardList(text) {
    var rows = [], bad = [];
    text.split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim();
      if (!line || /^(deck|sideboard|companion|commander|about|name)\b/i.test(line)) return;
      var m = line.match(/^(\d+)x?\s+(.+?)(?:\s+\(([A-Za-z0-9]{2,5})\)\s+(\S+))?$/);
      if (!m) { bad.push(line); return; }
      rows.push({ quantity: Number(m[1]), name: m[2].trim(), set: m[3] ? m[3].toLowerCase() : null, num: m[4] || null });
    });
    return { rows: rows, bad: bad };
  }

  // Texto de deck do Arena (aceita também listas simples tipo MTGO/Moxfield): secções «Deck», «Sideboard», «Commander», «Companion».
  // Linha de carta: "4 Llanowar Elves (FDN) 227" ou só "4 Llanowar Elves".
  function parseDeckText(text) {
    var rows = [], bad = [], name = null, zone = 'main', header = false, afterMain = false;
    var HEAD = /^(deck|main\s*deck|main|sideboard|side\s*board|side|commander|companion)\s*:?$/i;
    // normaliza: espaços invisíveis, \r isolado e colagens numa só linha (entradas coladas umas às outras)
    var norm = String(text || '').replace(/[\u00a0\u2007\u202f\u200b\ufeff]/g, ' ').replace(/\r\n?|\u2028|\u2029/g, '\n')
      .replace(/(\([A-Za-z0-9]{1,6}\)\s+\S+)[ \t]+(?=(?:\d{1,3}\s*x?\s+[^\s\d]|(?:deck|sideboard|commander|companion)\b))/gi, '$1\n')
      .replace(/^[ \t]*(deck|sideboard|commander|companion)[ \t]+(?=\d)/gim, '$1\n');
    norm.split('\n').forEach(function (raw) {
      var line = raw.replace(/\*F\*|\[[^\]]*\]/g, '').trim();   // tira marcas de foil e etiquetas
      if (!line) { if (!header && afterMain && zone === 'main') zone = 'side'; return; }   // sem cabeçalhos: a linha em branco separa o sideboard
      if (/^(\/\/|#)/.test(line) || /^about$/i.test(line)) return;
      var nm = line.match(/^(?:deck\s+)?name\s*:?\s+(.+)$/i);
      if (nm) { name = nm[1].trim(); return; }
      var hm = line.match(HEAD);
      if (hm) {
        var k = hm[1].toLowerCase().replace(/\s+/g, '');
        zone = (k === 'sideboard' || k === 'side') ? 'side' : k === 'commander' ? 'command' : k === 'companion' ? 'companion' : 'main';
        header = true; return;
      }
      var sb = /^SB:\s*/i.test(line);
      var m = line.replace(/^SB:\s*/i, '').match(/^(\d+)(?:\s*x)?\s+(.+?)(?:\s+\(([A-Za-z0-9]{1,6})\)(?:\s+(\S+))?)?$/);
      if (!m || Number(m[1]) < 1 || Number(m[1]) > 999) { bad.push(raw.trim()); return; }
      rows.push({ zone: sb ? 'side' : zone, quantity: Number(m[1]), name: m[2].trim(), set: m[3] ? m[3].toLowerCase() : null, num: m[4] || null });
      if (zone === 'main') afterMain = true;
    });
    return { rows: rows, bad: bad, name: name, explicit: header };
  }

  var api = { parsePlayerLog: parsePlayerLog, parseCardList: parseCardList, parseDeckText: parseDeckText, FORMAT_MAP: FORMAT_MAP };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.MTGLog = api;
})(typeof window !== 'undefined' ? window : this);

// Catálogo completo de cartas do Arena (cerca de 20 mil). Fica no aparelho e só se volta a descarregar se o número de cartas mudar.
async function loadCatalog(progress) {
  var cnt = (await q(sb.from('cards').select('arena_id', { count: 'exact', head: true }).not('arena_id', 'is', null))).count || 0;
  var cache = await KV.get('catalog18');
  if (cache && cache.n === cnt && cache.rows && cache.rows.length) return cache.rows;
  var pages = Math.max(1, Math.ceil(cnt / 1000)), rows = [], done = 0, parts = [];
  for (var g = 0; g < pages; g += 4) {
    var idx = [], k;
    for (k = g; k < Math.min(pages, g + 4); k++) idx.push(k);
    var res = await Promise.all(idx.map(function (p) {
      return q(sb.from('cards').select(CAT_SEL).not('arena_id', 'is', null).order('arena_id').range(p * 1000, p * 1000 + 999));
    }));
    res.forEach(function (r) { parts.push(r.data || []); done++; });
    if (progress) progress(done, pages);
  }
  parts.forEach(function (p) { p.forEach(function (r) { rows.push(normCat(r)); }); });
  KV.set('catalog18', { n: cnt, rows: rows });
  return rows;
}

      r.diff = diffPlan([], r, 'replace'); plan = r;
      if (parsed.name && !nameIn.value.trim()) nameIn.value = parsed.name;
      if (parsed.rows.some(function (x) { return x.zone === 'command'; })) fsel.value = 'brawl';
      fill(res,
        h('div', { class: 'note' }, r.total + ' cartas reconhecidas (' + planSummary(r) + '). Confirma o nome e o formato e guarda.'),
        r.unresolved.length ? listNote('Sem ID do Arena no catálogo (ficam guardadas pelo nome, set e número)', r.unresolved.map(function (u) { return u.quantity + '× ' + u.label; }), 'bad') : null,
        parsed.bad.length ? listNote('Linhas ignoradas (formato não reconhecido)', parsed.bad, 'warn') : null);
      go.textContent = 'Criar deck';
    } catch (e) { res.replaceChildren(h('div', { class: 'note bad', text: e.message })); plan = null; go.textContent = 'Verificar texto'; }
    go.disabled = false;
  });
  m.box.appendChild(h('div', { class: 'stack', style: 'padding:0' },
    h('div', { class: 'small muted', text: 'No Arena: abre o deck → Exportar (copia o texto) e cola aqui.' }),
    ta, h('label', null, 'Nome', nameIn), h('label', null, 'Formato', fsel), res, go));
}

async function saveLog(p, removeMissing, progress) {
  var uid = S.session.user.id;
  var counts = { decks: 0 };
  if (p.wallet) {
    await q(sb.from('user_wallet').upsert(Object.assign({ user_id: uid, updated_at: new Date().toISOString() }, p.wallet), { onConflict: 'user_id' }));
  }
  if (!p.hasDecks) return counts;
  var ex = await q(sb.from('decks').select('id,arena_deck_id').eq('source', 'log'));
  var byArena = {}; (ex.data || []).forEach(function (d) { byArena[d.arena_deck_id] = d.id; });
  var toCreate = [], toUpdate = [];
  p.decks.forEach(function (d) {
    var row = { user_id: uid, name: d.name, format_code: d.format_code, source: 'log', arena_deck_id: d.arena_deck_id, is_bo1: d.is_bo1, updated_at: new Date().toISOString() };
    if (byArena[d.arena_deck_id]) { row.id = byArena[d.arena_deck_id]; toUpdate.push(row); } else toCreate.push(row);
  });
  var idOf = {};
  Object.keys(byArena).forEach(function (k) { idOf[k] = byArena[k]; });
  if (toCreate.length) {
    var ins = await q(sb.from('decks').insert(toCreate).select('id,arena_deck_id'));
    ins.data.forEach(function (d) { idOf[d.arena_deck_id] = d.id; });
  }
  if (toUpdate.length) await q(sb.from('decks').upsert(toUpdate, { onConflict: 'id' }));
  // Cartas: deck a deck, com a mesma gravação segura das importações de texto (grava o que mudou, só depois apaga o que sobra
  // e confirma lendo outra vez). Se um deck falhar, os outros continuam e o deck com erro fica como estava ou completo, nunca vazio.
  // O Player.log traz as cartas reais, por isso as cartas «extra» (só pelo nome) deixam de ser precisas: writeDeck(…, []) apaga-as no fim.
  var failed = [], done = 0, next = 0;
  async function worker() {
    while (next < p.decks.length) {
      var d = p.decks[next++], fin = {};
      d.cards.forEach(function (c) { var k = c.arena_id + ':' + c.zone; fin[k] = (fin[k] || 0) + c.quantity; });
      try { await writeDeck(idOf[d.arena_deck_id], fin, []); } catch (e) { failed.push(d.name + ': ' + e.message); }
      done++; if (progress) progress(done, p.decks.length);
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  if (failed.length) throw new Error(sentence(failed.length, 'deck não ficou', 'decks não ficaram') + ' bem guardado(s) (' + failed.slice(0, 3).join(' | ') + (failed.length > 3 ? ' …' : '') + '). Os outros ' + (p.decks.length - failed.length) + ' ficaram guardados; tenta de novo.');
  if (removeMissing) {
    var keep = {}; p.decks.forEach(function (d) { keep[d.arena_deck_id] = true; });
    var gone = Object.keys(byArena).filter(function (k) { return !keep[k]; }).map(function (k) { return byArena[k]; });
    for (var g = 0; g < gone.length; g += 20) await q(sb.from('decks').delete().in('id', gone.slice(g, g + 20)));
  }
  counts.decks = p.decks.length;
  return counts;
}

/* ---------- coleção ---------- */
function splitCsv(line) {   // CSV simples com aspas
  var out = [], cur = '', q2 = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (q2) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q2 = false; } else cur += ch; }
    else if (ch === '"') q2 = true; else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch;
  }
  out.push(cur); return out;
}
// Aceita: JSON do mtga-tracker-daemon ({cards:[{grpId,owned}]}), lista de {arena_id,quantity}, mapa {id: quantidade}, CSV com cabeçalho, ou texto «4 Nome (SET) 123»
function parseCollectionInput(text) {
  var t = String(text || '').replace(/^﻿/, '').trim();
  if (!t) throw new Error('A caixa está vazia. Cola a coleção ou escolhe um ficheiro.');
  if (/^[\[{]/.test(t)) {
    var j; try { j = JSON.parse(t); } catch (e) { throw new Error('O JSON não é válido (cópia incompleta?): ' + e.message); }
    var arr = Array.isArray(j) ? j : Array.isArray(j && j.cards) ? j.cards : null, ids = {};
    if (arr) arr.forEach(function (c) {
      var id = Number(c.grpId != null ? c.grpId : c.arena_id != null ? c.arena_id : c.id), n = Number(c.owned != null ? c.owned : c.quantity != null ? c.quantity : c.count);
      if (id > 0 && n > 0) ids[id] = (ids[id] || 0) + n;
    });
    else if (j && typeof j === 'object') Object.keys(j).forEach(function (k) { var n = Number(j[k]); if (/^\d+$/.test(k) && n > 0) ids[k] = n; });
    if (!Object.keys(ids).length) throw new Error('Não encontrei cartas neste JSON (esperava «grpId» e «owned»).');
    return { kind: 'ids', ids: ids };
  }
  var lines = t.split(/\r?\n/), head = splitCsv(lines[0]).map(function (x) { return x.trim().toLowerCase(); });
  var ni = head.findIndex(function (x) { return /^(name|card name|card|nome)$/.test(x); });
  if (head.length > 1 && ni >= 0) {
    var qi = head.findIndex(function (x) { return /^(quantity|count|qty|owned|amount|quantidade)$/.test(x); });
    var si = head.findIndex(function (x) { return /^(set|set code|set_code|edition|edition code|expansion)$/.test(x); });
    var ci = head.findIndex(function (x) { return /^(collector number|collector_number|number|card number|#)$/.test(x); });
    var rows = [], bad = [];
    lines.slice(1).forEach(function (ln) {
      if (!ln.trim()) return;
      var c = splitCsv(ln), n = qi >= 0 ? Number(c[qi]) : 1;
      if (!c[ni] || !(n > 0)) { bad.push(ln); return; }
      rows.push({ quantity: n, name: c[ni].trim(), set: si >= 0 && c[si] ? c[si].trim().toLowerCase() : null, num: ci >= 0 && c[ci] ? c[ci].trim() : null });
    });
    return { kind: 'text', rows: rows, bad: bad };
  }
  var pl = window.MTGLog.parseCardList(t);
  if (!pl.rows.length) throw new Error('Não encontrei nenhuma linha válida. Usa «4 Nome da carta (SET) 123», um CSV com cabeçalho ou o JSON do tracker.');
  return { kind: 'text', rows: pl.rows, bad: pl.bad };
}
async function collectionIds(uid) {   // todos os arena_id guardados (por páginas de 1000)
  var all = [];
  for (var from = 0; ; from += 1000) {
    var r = await q(sb.from('user_collection').select('arena_id').eq('user_id', uid).order('arena_id').range(from, from + 999));
    (r.data || []).forEach(function (x) { all.push(x.arena_id); });
    if (!r.data || r.data.length < 1000) break;
  }
  return all;
}
// «Atualizar»: grava as quantidades da lista (não soma às existentes, para importar duas vezes a mesma lista dar o mesmo resultado).
// «Substituir»: grava primeiro, apaga depois o que sobra e confirma no fim (nunca deixa a coleção vazia se falhar a meio).
async function importCollection(text, replaceAll) {
  var uid = S.session.user.id, p = parseCollectionInput(text), qty = {}, notFound = [], bad = 0;
  if (p.kind === 'ids') Object.keys(p.ids).forEach(function (k) { qty[k] = p.ids[k]; });
  else {
    bad = p.bad.length;
    if (!p.rows.length) throw new Error('Não encontrei nenhuma linha de carta.');
    var plan = await resolveRows(p.rows.map(function (r) { return { zone: 'main', quantity: r.quantity, name: r.name, set: r.set, num: r.num }; }));
    plan.cards.forEach(function (c) { qty[c.arena_id] = (qty[c.arena_id] || 0) + c.quantity; });
    notFound = plan.unresolved.map(function (u) { return u.label; });
  }
  var ids = Object.keys(qty);
  if (!ids.length) throw new Error('Nenhuma carta foi reconhecida no catálogo.');
  var now = new Date().toISOString();
  var rows = ids.map(function (id) { return { user_id: uid, arena_id: Number(id), quantity: Math.min(qty[id], 99), updated_at: now }; });
  for (var k = 0; k < rows.length; k += 500) await q(sb.from('user_collection').upsert(rows.slice(k, k + 500), { onConflict: 'user_id,arena_id' }));
  var removed = 0;
  if (replaceAll) {
    var keep = {}; ids.forEach(function (id) { keep[id] = true; });
    var gone = (await collectionIds(uid)).filter(function (id) { return !keep[id]; });
    for (var g = 0; g < gone.length; g += 100) await q(sb.from('user_collection').delete().eq('user_id', uid).in('arena_id', gone.slice(g, g + 100)));
    removed = gone.length;
  }
  var cnt = await q(sb.from('user_collection').select('arena_id', { count: 'exact', head: true }));
  if (replaceAll && cnt.count !== rows.length) throw new Error('A verificação depois de guardar falhou (esperava ' + rows.length + ' cartas, a conta tem ' + cnt.count + '). Importa outra vez.');
  var unknownIds = 0;
  if (p.kind === 'ids') {   // quantas destas cartas o catálogo ainda não conhece
    var known = 0;
    for (var u = 0; u < ids.length; u += 300) { var kr = await q(sb.from('cards').select('arena_id').in('arena_id', ids.slice(u, u + 300))); known += (kr.data || []).length; }
    unknownIds = ids.length - known;
  }
  return { ok: rows.length, copies: rows.reduce(function (a, r) { return a + r.quantity; }, 0), notFound: notFound, bad: bad, removed: removed, total: cnt.count, unknownIds: unknownIds };
}

/* ---------- arranque ---------- */
async function boot() {
  sb.auth.onAuthStateChange(function (ev, session) {
    var was = S.session; S.session = session;
    if (!session) {
      closeCard(true); S.decks = null; S.cardCache = {}; S.wallet = null; S.events = null; S.bans = {}; S.collCount = null; S.coll = null; S.cat = null; S.needMfa = false; S.offline = false; S.recovery = false;
      KV.del('snap');   // a cópia local dos dados sai do aparelho
      Array.prototype.forEach.call(document.querySelectorAll('.sheet, .cm'), function (s) { s.remove(); });
      ovReset(); document.body.style.overflow = ''; render(); return;
    }
    if (ev === 'PASSWORD_RECOVERY') S.recovery = true;
    // fora do callback: chamar o Supabase aqui dentro pode bloquear o pedido de sessão
    if (!was || was.user.id !== session.user.id || ev === 'PASSWORD_RECOVERY') setTimeout(afterAuth, 0);
  });
  // A sessão chega pelo evento INITIAL_SESSION acima (uma só vez, sem carregar os dados em duplicado).
  // Plano B: se o evento não vier (versão antiga da biblioteca), pergunta diretamente.
  setTimeout(async function () {
    if (S.session || S.decks) return;
    var r = await sb.auth.getSession();
    if (r.data.session && !S.session) { S.session = r.data.session; afterAuth(); } else if (!S.session) render();
  }, 1500);
}
async function startLoad() {
  S.decks = null; render();
  try { await loadAll(); render(); }
  catch (e) { $app.replaceChildren(h('div', { class: 'wrap stack', style: 'padding-top:24px' }, h('div', { class: 'note bad', text: 'Erro ao carregar os dados: ' + e.message }), h('button', { class: 'btn', type: 'button', text: 'Tentar de novo', onclick: startLoad }))); }
}
boot();
})();
